version: "3.8"

services:
  rossensor:
    image: ros1
    container_name: ros
    runtime: nvidia
    gpus: all
    privileged: true
    network_mode: "host"
    init: true
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=${XAUTHORITY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/home/mapping/.Xauthority}:/root/.Xauthority:ro
      - /home/mapping/ros1_ws/jetson_sensor/:/ros_noetic/mapping_ws/
      - /media/mapping/datassd3:/data
      - /dev/:/dev/
    working_dir: /ros_noetic/mapping_ws/
    tty: true
    stdin_open: true
    restart: unless-stopped
